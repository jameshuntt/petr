[package]
name = "petr-execution"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional composition of PETR temporal, affinity, resource and dispatch policy with scoped execution."
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
petr-temporal = { path = "../petr-temporal", version = "0.2.0" }
petr-affinity = { path = "../petr-affinity", version = "0.2.0" }
petr-resource = { path = "../petr-resource", version = "0.2.0" }
petr-protection = { path = "../petr-protection", version = "0.2.0" }
petr-dispatch = { path = "../petr-dispatch", version = "0.2.0", optional = true }
scope = "0.3.1"
waker_protocol = { version = "0.3.1", optional = true }
ob-serve-a-bowl = { version = "0.2.2", optional = true }
thiserror = { workspace = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dev-dependencies]
proptest = "1"
petr-core = { path = "../petr-core", version = "0.2.0" }

[features]
default = []
core-affinity = ["petr-affinity/core-affinity"]
dispatch = ["dep:petr-dispatch"]
waker-protocol = ["dep:waker_protocol"]
observable = ["dep:ob-serve-a-bowl"]
adapters = ["dispatch", "waker-protocol", "observable"]

[[example]]
name = "optional_adapters"
required-features = ["adapters"]

[package.metadata.docs.rs]
all-features = true
