[package]
name = "petr-collections"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Keyed arenas, paged keyed arenas and encoded generation-checked handles for petr tagged words."
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
[dependencies]
petr-core = { path = "../petr-core", version = "0.2.0" }
