[package]
name = "petr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Facade for the petr tagged-pointer crates: core, dispatch, collections, resource, math and spatial."
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
petr-core = { path = "../petr-core", version = "0.1.0" }
petr-dispatch = { path = "../petr-dispatch", version = "0.1.0" }
petr-collections = { path = "../petr-collections", version = "0.1.0" }
petr-resource = { path = "../petr-resource", version = "0.1.0" }
petr-math = { path = "../petr-math", version = "0.1.0" }
petr-spatial = { path = "../petr-spatial", version = "0.1.0" }

[features]
default = []
serde = ["petr-core/serde", "petr-collections/serde"]
